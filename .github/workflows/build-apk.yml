
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q NotificationToTelegram-GitHub-Actions.zip -d source

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      
     
      - name: Install SDK
        run: |
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

     
      - name: Build APK
        working-directory: source/NotificationToTelegram
        run: |
          sed -i '/android {/a\    compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_17\n        targetCompatibility = JavaVersion.VERSION_17\n    }' app/build.gradle.kts
          gradle --no-daemon assembleDebug


      - uses: actions/upload-artifact@v4
        with:
          name: NotificationToTelegram-debug-apk
          path: source/NotificationToTelegram/app/build/outputs/apk/debug/app-debug.apk
